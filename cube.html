<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큐브 도안 생성기</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Lucide React icons as inline SVG components
        const Upload = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
        );

        const Download = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
        );

        const ZoomIn = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                <line x1="11" y1="8" x2="11" y2="14" />
                <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
        );

        const ZoomOut = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
        );

        const Pipette = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="m2 22 1-1h3l9-9" />
                <path d="M3 21v-3l9-9" />
                <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l-3-3Z" />
            </svg>
        );

        const CubePatternGenerator = () => {
          const [uploadedImage, setUploadedImage] = useState(null);
          const [pixelSize, setPixelSize] = useState(30);
          const [pixelWidth, setPixelWidth] = useState(30);
          const [pixelHeight, setPixelHeight] = useState(30);
          const [useCustomDimensions, setUseCustomDimensions] = useState(false);
          const [colors, setColors] = useState([
            '#FF0000',
            '#00FF00',
            '#0000FF',
            '#FFFF00',
            '#FF8000',
            '#FFFFFF'
          ]);
          const [pixelatedData, setPixelatedData] = useState(null);
          const [zoom, setZoom] = useState(1);
          const [isProcessing, setIsProcessing] = useState(false);
          const [activeColorPicker, setActiveColorPicker] = useState(null);
          const [isPipetteMode, setPipetteMode] = useState(false);
          const [pipetteColorIndex, setPipetteColorIndex] = useState(null);
          const [showTutorial, setShowTutorial] = useState(true);
          
          const fileInputRef = useRef(null);
          const canvasRef = useRef(null);
          const outputCanvasRef = useRef(null);
          const originalImageRef = useRef(null);

          const extractDominantColors = (imageData, numColors = 6) => {
            const pixels = [];
            for (let i = 0; i < imageData.data.length; i += 4) {
              pixels.push([
                imageData.data[i],
                imageData.data[i + 1],
                imageData.data[i + 2]
              ]);
            }

            let centroids = [];
            for (let i = 0; i < numColors; i++) {
              const randomPixel = pixels[Math.floor(Math.random() * pixels.length)];
              centroids.push([...randomPixel]);
            }

            for (let iteration = 0; iteration < 10; iteration++) {
              const clusters = Array(numColors).fill().map(() => []);
              
              pixels.forEach(pixel => {
                let minDist = Infinity;
                let clusterIndex = 0;
                
                centroids.forEach((centroid, i) => {
                  const dist = Math.sqrt(
                    Math.pow(pixel[0] - centroid[0], 2) +
                    Math.pow(pixel[1] - centroid[1], 2) +
                    Math.pow(pixel[2] - centroid[2], 2)
                  );
                  if (dist < minDist) {
                    minDist = dist;
                    clusterIndex = i;
                  }
                });
                
                clusters[clusterIndex].push(pixel);
              });

              centroids = clusters.map(cluster => {
                if (cluster.length === 0) return centroids[0];
                const sum = cluster.reduce((acc, pixel) => [
                  acc[0] + pixel[0],
                  acc[1] + pixel[1],
                  acc[2] + pixel[2]
                ], [0, 0, 0]);
                return [
                  Math.round(sum[0] / cluster.length),
                  Math.round(sum[1] / cluster.length),
                  Math.round(sum[2] / cluster.length)
                ];
              });
            }

            return centroids.map(c => 
              `#${c.map(v => v.toString(16).padStart(2, '0')).join('')}`
            );
          };

          const findClosestColor = (r, g, b, palette) => {
            let minDist = Infinity;
            let closestColor = palette[0];
            
            palette.forEach(color => {
              const hexR = parseInt(color.slice(1, 3), 16);
              const hexG = parseInt(color.slice(3, 5), 16);
              const hexB = parseInt(color.slice(5, 7), 16);
              
              const dist = Math.sqrt(
                Math.pow(r - hexR, 2) +
                Math.pow(g - hexG, 2) +
                Math.pow(b - hexB, 2)
              );
              
              if (dist < minDist) {
                minDist = dist;
                closestColor = color;
              }
            });
            
            return closestColor;
          };

          const processImage = () => {
            if (!uploadedImage) return;
            
            setIsProcessing(true);
            
            const img = new Image();
            img.onload = () => {
              const canvas = canvasRef.current;
              const ctx = canvas.getContext('2d');
              
              let cols, rows;
              if (useCustomDimensions) {
                cols = parseInt(pixelWidth) || 30;
                rows = parseInt(pixelHeight) || 30;
              } else {
                cols = pixelSize;
                const aspectRatio = img.height / img.width;
                rows = Math.round(cols * aspectRatio);
              }
              
              canvas.width = cols;
              canvas.height = rows;
              
              ctx.drawImage(img, 0, 0, cols, rows);
              const imageData = ctx.getImageData(0, 0, cols, rows);
              
              const detectedColors = extractDominantColors(imageData, 6);
              setColors(detectedColors);
              
              const pixelData = [];
              for (let y = 0; y < rows; y++) {
                const row = [];
                for (let x = 0; x < cols; x++) {
                  const i = (y * cols + x) * 4;
                  const r = imageData.data[i];
                  const g = imageData.data[i + 1];
                  const b = imageData.data[i + 2];
                  const color = findClosestColor(r, g, b, detectedColors);
                  row.push(color);
                }
                pixelData.push(row);
              }
              
              setPixelatedData(pixelData);
              setIsProcessing(false);
            };
            
            img.src = uploadedImage;
          };

          const reprocessWithCurrentColors = () => {
            if (!uploadedImage) return;
            
            const img = new Image();
            img.onload = () => {
              const canvas = canvasRef.current;
              const ctx = canvas.getContext('2d');
              
              let cols, rows;
              if (useCustomDimensions) {
                cols = parseInt(pixelWidth) || 30;
                rows = parseInt(pixelHeight) || 30;
              } else {
                cols = pixelSize;
                const aspectRatio = img.height / img.width;
                rows = Math.round(cols * aspectRatio);
              }
              
              canvas.width = cols;
              canvas.height = rows;
              
              ctx.drawImage(img, 0, 0, cols, rows);
              const imageData = ctx.getImageData(0, 0, cols, rows);
              
              const pixelData = [];
              for (let y = 0; y < rows; y++) {
                const row = [];
                for (let x = 0; x < cols; x++) {
                  const i = (y * cols + x) * 4;
                  const r = imageData.data[i];
                  const g = imageData.data[i + 1];
                  const b = imageData.data[i + 2];
                  const color = findClosestColor(r, g, b, colors);
                  row.push(color);
                }
                pixelData.push(row);
              }
              
              setPixelatedData(pixelData);
            };
            
            img.src = uploadedImage;
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
              const reader = new FileReader();
              reader.onload = (event) => {
                setUploadedImage(event.target.result);
                originalImageRef.current = event.target.result;
              };
              reader.readAsDataURL(file);
            }
          };

          useEffect(() => {
            if (!pixelatedData) return;
            
            const canvas = outputCanvasRef.current;
            const ctx = canvas.getContext('2d');
            
            const cellSize = 20;
            const cols = pixelatedData[0].length;
            const rows = pixelatedData.length;
            
            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;
            
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                ctx.fillStyle = pixelatedData[y][x];
                ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
              }
            }
            
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            for (let y = 0; y <= rows; y++) {
              ctx.beginPath();
              ctx.moveTo(0, y * cellSize);
              ctx.lineTo(cols * cellSize, y * cellSize);
              ctx.stroke();
            }
            for (let x = 0; x <= cols; x++) {
              ctx.beginPath();
              ctx.moveTo(x * cellSize, 0);
              ctx.lineTo(x * cellSize, rows * cellSize);
              ctx.stroke();
            }
          }, [pixelatedData]);

          useEffect(() => {
            if (uploadedImage) {
              processImage();
            }
          }, [uploadedImage, pixelSize, pixelWidth, pixelHeight, useCustomDimensions]);

          useEffect(() => {
            if (uploadedImage && pixelatedData) {
              reprocessWithCurrentColors();
            }
          }, [colors]);

          const downloadImage = () => {
            if (!outputCanvasRef.current) return;
            
            const link = document.createElement('a');
            link.download = 'cube-pattern.png';
            link.href = outputCanvasRef.current.toDataURL();
            link.click();
          };

          const handleCanvasClick = (e) => {
            if (!isPipetteMode || pipetteColorIndex === null) return;
            
            const canvas = outputCanvasRef.current;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            
            const ctx = canvas.getContext('2d');
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            const pickedColor = `#${[pixel[0], pixel[1], pixel[2]].map(v => 
              v.toString(16).padStart(2, '0')).join('')}`;
            
            const newColors = [...colors];
            newColors[pipetteColorIndex] = pickedColor;
            setColors(newColors);
            setPipetteMode(false);
            setPipetteColorIndex(null);
          };

          return (
            <div style={{ 
              padding: '20px', 
              maxWidth: '1600px', 
              margin: '0 auto',
              fontFamily: 'Arial, sans-serif',
              backgroundColor: '#f0f4f8'
            }}>
              <div style={{
                textAlign: 'center',
                marginBottom: '30px',
                padding: '30px',
                backgroundColor: 'white',
                borderRadius: '15px',
                boxShadow: '0 4px 6px rgba(0,0,0,0.1)'
              }}>
                <h1 style={{ 
                  color: '#2c3e50',
                  marginBottom: '10px',
                  fontSize: '36px',
                  fontWeight: 'bold'
                }}>
                  🎨 큐브 도안 생성기
                </h1>
                <p style={{
                  color: '#7f8c8d',
                  fontSize: '18px',
                  marginBottom: '20px'
                }}>
                  이미지를 업로드하여 6가지 색상의 큐브 크로스스티치 도안으로 변환하세요
                </p>
                <button
                  onClick={() => setShowTutorial(!showTutorial)}
                  style={{
                    padding: '10px 20px',
                    backgroundColor: showTutorial ? '#e74c3c' : '#3498db',
                    color: 'white',
                    border: 'none',
                    borderRadius: '5px',
                    cursor: 'pointer',
                    fontSize: '14px',
                    fontWeight: 'bold'
                  }}
                >
                  {showTutorial ? '📖 사용 가이드 숨기기' : '📖 사용 가이드 보기'}
                </button>
              </div>

              {showTutorial && (
                <div style={{
                  marginBottom: '30px',
                  padding: '30px',
                  backgroundColor: 'white',
                  borderRadius: '15px',
                  boxShadow: '0 4px 6px rgba(0,0,0,0.1)',
                  border: '3px solid #3498db'
                }}>
                  <h2 style={{
                    color: '#2c3e50',
                    marginBottom: '25px',
                    fontSize: '24px',
                    textAlign: 'center'
                  }}>
                    📋 큐브 도안 만들기 - 단계별 가이드
                  </h2>
                  
                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
                    gap: '20px',
                    marginBottom: '30px'
                  }}>
                    <div style={{
                      padding: '20px',
                      backgroundColor: '#ecf0f1',
                      borderRadius: '10px',
                      borderLeft: '5px solid #3498db'
                    }}>
                      <div style={{ fontSize: '32px', marginBottom: '10px' }}>1️⃣</div>
                      <h3 style={{ color: '#2c3e50', marginBottom: '10px' }}>이미지 업로드</h3>
                      <p style={{ color: '#7f8c8d', lineHeight: '1.6' }}>
                        <strong>"이미지 업로드"</strong> 버튼을 클릭하여 변환하고 싶은 이미지를 선택하세요.
                      </p>
                    </div>

                    <div style={{
                      padding: '20px',
                      backgroundColor: '#ecf0f1',
                      borderRadius: '10px',
                      borderLeft: '5px solid #9b59b6'
                    }}>
                      <div style={{ fontSize: '32px', marginBottom: '10px' }}>2️⃣</div>
                      <h3 style={{ color: '#2c3e50', marginBottom: '10px' }}>픽셀 크기 설정</h3>
                      <p style={{ color: '#7f8c8d', lineHeight: '1.6' }}>
                        정확한 픽셀 수를 입력하세요. (예: 30×30, 90×90)
                      </p>
                    </div>

                    <div style={{
                      padding: '20px',
                      backgroundColor: '#ecf0f1',
                      borderRadius: '10px',
                      borderLeft: '5px solid #e67e22'
                    }}>
                      <div style={{ fontSize: '32px', marginBottom: '10px' }}>3️⃣</div>
                      <h3 style={{ color: '#2c3e50', marginBottom: '10px' }}>색상 조정</h3>
                      <p style={{ color: '#7f8c8d', lineHeight: '1.6' }}>
                        자동으로 추출된 6가지 색상을 조정하세요.
                      </p>
                    </div>
                  </div>
                </div>
              )}

              <canvas ref={canvasRef} style={{ display: 'none' }} />
              <canvas 
                ref={outputCanvasRef} 
                onClick={handleCanvasClick}
                style={{ display: pixelatedData ? 'block' : 'none', margin: '0 auto', border: '2px solid #333' }}
              />

              <div style={{ textAlign: 'center', marginTop: '20px' }}>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  onChange={handleFileUpload}
                  style={{ display: 'none' }}
                />
                <button onClick={() => fileInputRef.current.click()} style={{ padding: '12px 24px', margin: '10px' }}>
                  이미지 업로드
                </button>
                {pixelatedData && (
                  <button onClick={downloadImage} style={{ padding: '12px 24px', margin: '10px' }}>
                    다운로드
                  </button>
                )}
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CubePatternGenerator />);
    </script>
</body>
</html>
